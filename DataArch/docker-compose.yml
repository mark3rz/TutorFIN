# ──────────────────────────────────────────────────────────────
# DataArch.AI — Docker Compose
#
# Usage:
#   docker-compose up              Start all services
#   docker-compose up -d           Start in background
#   docker-compose down            Stop all services
#   docker-compose down -v         Stop and delete database volumes
#   docker-compose logs -f api     Follow API logs
#
# Prerequisites:
#   1. Copy .env.example to .env and add your API keys
#   2. Docker and Docker Compose installed
# ──────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 with pgvector ──────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: dataarch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataarch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataarch}
      POSTGRES_DB: ${POSTGRES_DB:-dataarch}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataarch} -d ${POSTGRES_DB:-dataarch}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── DataArch.AI API ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataarch-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dataarch}:${POSTGRES_PASSWORD:-dataarch}@db:5432/${POSTGRES_DB:-dataarch}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      DATAARCH_MODEL: ${DATAARCH_MODEL:-claude-sonnet-4-5-20250929}
      DATAARCH_ENV: ${DATAARCH_ENV:-docker}
      JWT_SECRET: ${JWT_SECRET:-dataarch-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Named volume keeps pipeline outputs across container rebuilds.
      # To inspect outputs locally: docker cp dataarch-api:/app/outputs ./outputs
      - dataarch-outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    driver: local
  dataarch-outputs:
    driver: local
