# Alembic configuration for DataArch.AI
#
# DATABASE_URL is read from config.py at runtime (see alembic/env.py),
# so the sqlalchemy.url below is only a fallback.

[alembic]
script_location = alembic
prepend_sys_path = .

# Template for migration filenames
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max length of the slug field
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

sqlalchemy.url = postgresql://dataarch:dataarch@localhost:5432/dataarch

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
